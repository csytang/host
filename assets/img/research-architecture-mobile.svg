<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1760" role="img" aria-labelledby="title desc">
  <title id="title">Mobile research architecture for Trustworthy AI for Software and Agentic Systems</title>
  <desc id="desc">A vertical version of the research architecture. The programme contains three research directions above supporting methods, validation environments, outcomes, and a six-step assurance flow.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17355f}.white{fill:#fff}.navy{fill:#073b88}.teal{fill:#0b7f83}.soft{fill:#f4f7fb}.line{stroke:#7896ba;stroke-width:3;fill:none}.title{font-size:27px;font-weight:700}.programme{font-size:23px;font-weight:700}.heading{font-size:21px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:16px}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#51759d"/></marker>
  </defs>
  <rect width="640" height="1760" rx="16" class="white"/>
  <rect x="24" y="24" width="592" height="105" rx="12" class="navy"/><text x="320" y="65" text-anchor="middle" class="white title"><tspan x="320">Trustworthy AI for Software</tspan><tspan x="320" dy="33">and Agentic Systems</tspan></text>
  <path d="M320 129v25" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="160" width="556" height="96" rx="12" fill="#e9f3f3" stroke="#0b7f83" stroke-width="3"/><text x="320" y="201" text-anchor="middle" class="programme"><tspan x="320">Secure and Verifiable Agentic</tspan><tspan x="320" dy="29">Software Engineering</tspan></text>
  <path d="M320 256v25" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="287" width="556" height="108" rx="12" fill="#f0f8f8" stroke="#0b7f83" stroke-width="3"/><circle cx="82" cy="327" r="23" class="teal"/><text x="82" y="334" text-anchor="middle" class="white label">1</text><text x="320" y="326" text-anchor="middle" class="heading"><tspan x="320">Agent Permission and</tspan><tspan x="320" dy="27">Intent Semantics</tspan></text><text x="320" y="380" text-anchor="middle" class="small">Is the action authorised?</text>
  <path d="M320 395v20" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="421" width="556" height="108" rx="12" class="soft" stroke="#2f66a6" stroke-width="3"/><circle cx="82" cy="461" r="23" class="navy"/><text x="82" y="468" text-anchor="middle" class="white label">2</text><text x="320" y="460" text-anchor="middle" class="heading"><tspan x="320">Semantic Validation of</tspan><tspan x="320" dy="27">AI-Generated Software</tspan></text><text x="320" y="514" text-anchor="middle" class="small">Is the software verifiable?</text>
  <path d="M320 529v20" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="555" width="556" height="132" rx="12" class="soft" stroke="#2f66a6" stroke-width="3"/><circle cx="82" cy="595" r="23" class="navy"/><text x="82" y="602" text-anchor="middle" class="white label">3</text><text x="320" y="590" text-anchor="middle" class="heading"><tspan x="320">Runtime Evidence and Accountability</tspan><tspan x="320" dy="27">for Agentic Workflows</tspan></text><text x="320" y="660" text-anchor="middle" class="small">Is the execution accountable?</text>
  <path d="M320 687v22" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="715" width="556" height="154" rx="12" fill="#f7f9fc" stroke="#90a7c6" stroke-width="3" stroke-dasharray="7 6"/><text x="320" y="746" text-anchor="middle" class="small" font-weight="700">SUPPORTING METHODS</text><text x="320" y="781" text-anchor="middle" class="label">Program Analysis · Software Security</text><text x="320" y="815" text-anchor="middle" class="label">Runtime Monitoring · Empirical Evaluation</text><text x="320" y="849" text-anchor="middle" class="label">Benchmark Design</text>
  <path d="M320 869v22" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="897" width="556" height="90" rx="12" fill="#eef5fb" stroke="#6687af" stroke-width="3"/><text x="320" y="929" text-anchor="middle" class="small" font-weight="700">APPLICATION AND VALIDATION</text><text x="320" y="965" text-anchor="middle" class="label">Mobile and Software Ecosystem Security</text>
  <rect x="42" y="1001" width="556" height="90" rx="12" fill="#eef5fb" stroke="#6687af" stroke-width="3"/><text x="320" y="1033" text-anchor="middle" class="small" font-weight="700">APPLICATION AND VALIDATION</text><text x="320" y="1069" text-anchor="middle" class="label">Computational and Developer Workflows</text>
  <path d="M320 1091v22" class="line" marker-end="url(#arrow)"/>
  <rect x="42" y="1119" width="556" height="134" rx="12" fill="#eaf5f3" stroke="#0b7f83" stroke-width="3"/><text x="320" y="1151" text-anchor="middle" class="small" font-weight="700">OUTCOMES</text><text x="320" y="1185" text-anchor="middle" class="label">Secure Systems · Verifiable Software</text><text x="320" y="1217" text-anchor="middle" class="label">Accountable Agents · Trusted Deployment</text><text x="320" y="1243" text-anchor="middle" class="small">Reduced Public Fear and Uncertainty</text>
  <text x="42" y="1298" class="small" font-weight="700">CAUSAL ASSURANCE FLOW</text>
  <g class="small" font-weight="700"><rect x="42" y="1315" width="170" height="70" rx="8" class="soft" stroke="#6687af"/><text x="127" y="1344" text-anchor="middle"><tspan x="127">User Intent and</tspan><tspan x="127" dy="20">Software Context</tspan></text><path d="M212 1350h20" class="line" marker-end="url(#arrow)"/><rect x="238" y="1315" width="170" height="70" rx="8" class="soft" stroke="#6687af"/><text x="323" y="1344" text-anchor="middle"><tspan x="323">Permission and</tspan><tspan x="323" dy="20">Semantic Reasoning</tspan></text><path d="M408 1350h20" class="line" marker-end="url(#arrow)"/><rect x="434" y="1315" width="164" height="70" rx="8" class="soft" stroke="#6687af"/><text x="516" y="1356" text-anchor="middle">Controlled Execution</text>
  <path d="M516 1385v22" class="line" marker-end="url(#arrow)"/><rect x="434" y="1413" width="164" height="70" rx="8" class="soft" stroke="#6687af"/><text x="516" y="1454" text-anchor="middle">Runtime Evidence</text><path d="M434 1448h-20" class="line" marker-end="url(#arrow)"/><rect x="238" y="1413" width="170" height="70" rx="8" class="soft" stroke="#6687af"/><text x="323" y="1442" text-anchor="middle"><tspan x="323">Evaluation and</tspan><tspan x="323" dy="20">Validation</tspan></text><path d="M238 1448h-20" class="line" marker-end="url(#arrow)"/><rect x="42" y="1413" width="170" height="70" rx="8" fill="#e9f3f3" stroke="#0b7f83" stroke-width="3"/><text x="127" y="1442" text-anchor="middle"><tspan x="127">Trust, Constraint,</tspan><tspan x="127" dy="20">or Rejection</tspan></text></g>
  <text x="320" y="1545" text-anchor="middle" class="small" font-weight="700">TRUST IS CREATED THROUGH</text>
  <text x="320" y="1582" text-anchor="middle" class="label">Explicit Intent</text><text x="320" y="1614" text-anchor="middle" class="label">Semantic Analysis</text><text x="320" y="1646" text-anchor="middle" class="label">Controlled Execution</text><text x="320" y="1678" text-anchor="middle" class="label">Runtime Evidence</text><text x="320" y="1710" text-anchor="middle" class="label">Empirical Evaluation</text>
</svg>
